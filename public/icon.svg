<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="walletGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4CAF50" />
      <stop offset="100%" style="stop-color:#2E7D32" />
    </linearGradient>
    <linearGradient id="flapGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#66BB6A" />
      <stop offset="100%" style="stop-color:#388E3C" />
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="#E8F5E9" />
  <!-- Wallet body -->
  <rect x="96" y="180" width="320" height="200" rx="24" ry="24" fill="url(#walletGrad)" />
  <!-- Wallet flap -->
  <path d="M96 200 C96 160 96 140 120 132 L360 108 C390 104 416 124 416 154 L416 180 L96 180 Z"
    fill="url(#flapGrad)" />
  <!-- Card slot detail -->
  <rect x="296" y="248" width="100" height="64" rx="12" ry="12" fill="#E8F5E9" opacity="0.9" />
  <!-- Coin circle in slot -->
  <circle cx="346" cy="280" r="20" fill="#FFC107" stroke="#FF8F00" stroke-width="3" />
  <!-- Dollar sign on coin -->
  <text x="346" y="288" font-family="Arial, sans-serif" font-size="24" font-weight="bold"
    fill="#FF8F00" text-anchor="middle">$</text>
  <!-- Stitching detail -->
  <line x1="116" y1="340" x2="396" y2="340" stroke="#1B5E20" stroke-width="2" stroke-dasharray="8,6"
    opacity="0.4" />
</svg>