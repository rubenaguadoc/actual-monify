<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2d2d2d">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Mis Finanzas</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="stylesheet" href="index.css" />
</head>

<body>
  <!-- Overlay for mobile drawer -->
  <div class="drawer-overlay" id="drawer-overlay"></div>

  <!-- Side drawer (mobile) / Sidebar (desktop) -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-section">
      <div class="sidebar-account-selector" id="sidebar-account-selector">
        <div class="sidebar-account-current" id="sidebar-account-current">
          <span class="account-icon">🏷️</span>
          <span class="account-label">Todas las cuentas</span>
          <span class="account-currency">EUR</span>
          <span class="dropdown-arrow">▾</span>
        </div>
        <div class="sidebar-account-list" id="sidebar-account-list"></div>
      </div>
    </div>
    <div class="sidebar-section">
      <div class="sidebar-period-list" id="sidebar-period-list">
        <button class="sidebar-period-btn" data-period="day">Día</button>
        <button class="sidebar-period-btn" data-period="week">Semana</button>
        <button class="sidebar-period-btn active" data-period="month">Mes</button>
        <button class="sidebar-period-btn" data-period="year">Año</button>
        <button class="sidebar-period-btn" data-period="all">Todo</button>
        <button class="sidebar-period-btn" data-period="custom">Intervalo</button>
      </div>
      <!-- Custom date range -->
      <div class="custom-dates" id="custom-dates">
        <input type="date" id="date-from">
        <span class="date-arrow">→</span>
        <input type="date" id="date-to">
        <button class="apply-btn" id="apply-custom">Aplicar</button>
      </div>
    </div>
    <div class="sidebar-section sidebar-sync">
      <button class="sync-btn" id="sync-btn">
        <svg class="sync-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2">
          <path d="M23 4v6h-6" />
          <path d="M1 20v-6h6" />
          <path d="M3.51 9a9 9 0 0114.85-3.36L23 10" />
          <path d="M20.49 15a9 9 0 01-14.85 3.36L1 14" />
        </svg>
        <span>Sincronizar datos</span>
      </button>
      <span class="sync-status" id="sync-status"></span>
    </div>
  </aside>

  <!-- Main content area -->
  <main class="main-content">
    <!-- Sticky header area -->
    <div class="sticky-header">
      <!-- Top bar -->
      <header class="top-bar">
        <button class="menu-btn" id="menu-btn">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="3" y1="6" x2="21" y2="6" />
            <line x1="3" y1="12" x2="21" y2="12" />
            <line x1="3" y1="18" x2="21" y2="18" />
          </svg>
        </button>
        <h1 class="app-title" id="app-title">Mis Finanzas</h1>
        <button class="today-btn" id="today-btn" title="Ir al periodo actual">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="4" width="18" height="18" rx="2" />
            <line x1="16" y1="2" x2="16" y2="6" />
            <line x1="8" y1="2" x2="8" y2="6" />
            <line x1="3" y1="10" x2="21" y2="10" />
            <circle cx="12" cy="16" r="2" fill="currentColor" stroke="none" />
          </svg>
        </button>
        <button class="search-btn" id="search-btn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8" />
            <line x1="21" y1="21" x2="16.65" y2="16.65" />
          </svg>
        </button>
      </header>

      <!-- Period navigation -->
      <div class="period-nav">
        <button id="prev-period">‹</button>
        <span class="period-label" id="period-label">Mayo</span>
        <input type="date" id="period-date-picker" class="period-date-picker">
        <button id="next-period">›</button>
      </div>

      <!-- Balance pill -->
      <div class="balance-pill" id="balance-pill">
        <span class="balance-pill-label">Balance</span>
        <span class="balance-pill-amount" id="balance-amount">—</span>
      </div>

      <!-- Summary row -->
      <div class="summary-row">
        <div class="summary-item carry">
          <span class="summary-label">Anterior</span>
          <span class="summary-value" id="carry-amount">—</span>
        </div>
        <div class="summary-item income">
          <span class="summary-label">Ingresos</span>
          <span class="summary-value" id="income-amount">—</span>
        </div>
        <div class="summary-item expense">
          <span class="summary-label">Gastos</span>
          <span class="summary-value" id="expense-amount">—</span>
        </div>
      </div>

      <!-- Toolbar: view toggle + expand/collapse -->
      <div class="content-toolbar">
        <div class="view-toggle">
          <button class="view-btn active" id="view-category" title="Por categoría">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="3" width="7" height="7" />
              <rect x="14" y="3" width="7" height="7" />
              <rect x="3" y="14" width="7" height="7" />
              <rect x="14" y="14" width="7" height="7" />
            </svg>
          </button>
          <button class="view-btn" id="view-date" title="Por fecha">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="4" width="18" height="18" rx="2" />
              <line x1="16" y1="2" x2="16" y2="6" />
              <line x1="8" y1="2" x2="8" y2="6" />
              <line x1="3" y1="10" x2="21" y2="10" />
            </svg>
          </button>
        </div>
        <div class="expand-collapse-btns">
          <button class="toolbar-btn" id="expand-all" title="Expandir todo">▼</button>
          <button class="toolbar-btn" id="collapse-all" title="Contraer todo">▲</button>
        </div>
      </div>
    </div>

    <!-- Search modal -->
    <div class="search-modal-overlay" id="search-modal-overlay">
      <div class="search-modal">
        <div class="search-modal-top">
          <div class="search-modal-header">
            <span class="search-modal-title">Buscar</span>
            <button class="search-modal-close" id="search-modal-close">✕</button>
          </div>
          <div class="search-input-row">
            <input type="text" id="search-input" placeholder="Buscar concepto…">
            <button id="search-go">Buscar</button>
          </div>
        </div>
        <div class="search-results" id="search-results"></div>
      </div>
    </div>

    <!-- Content area (swipeable) -->
    <div class="swipe-container" id="swipe-container">
      <div class="swipe-content" id="content">
        <div class="loading">
          <div class="spinner"></div>
          Cargando datos…
        </div>
      </div>
    </div>

    <!-- FAB: new transaction -->
    <button class="fab" id="fab-new" title="Nueva transacción">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <line x1="12" y1="5" x2="12" y2="19" />
        <line x1="5" y1="12" x2="19" y2="12" />
      </svg>
    </button>

    <!-- New transaction modal -->
    <div class="newtx-overlay" id="newtx-overlay">
      <div class="newtx-modal">
        <div class="newtx-header">
          <span class="newtx-title" id="newtx-title">Nueva transacción</span>
          <button class="newtx-close" id="newtx-close">✕</button>
        </div>
        <form class="newtx-form" id="newtx-form" autocomplete="off">
          <!-- Date -->
          <div class="newtx-field">
            <label for="newtx-date">Fecha</label>
            <input type="date" id="newtx-date" required>
          </div>
          <!-- Type -->
          <div class="newtx-field">
            <label for="newtx-type">Tipo</label>
            <select id="newtx-type">
              <option value="expense">Gasto</option>
              <option value="income">Ingreso</option>
              <option value="transfer">Transferencia</option>
            </select>
          </div>
          <!-- Account -->
          <div class="newtx-field">
            <label for="newtx-account-input">Cuenta origen</label>
            <div class="newtx-filterable" id="newtx-account-wrapper">
              <input type="text" id="newtx-account-input" placeholder="Buscar cuenta…" autocomplete="off" required>
              <input type="hidden" id="newtx-account-value">
              <div class="newtx-dropdown" id="newtx-account-dropdown"></div>
            </div>
          </div>
          <!-- Amount -->
          <div class="newtx-field">
            <label for="newtx-amount">Importe</label>
            <input type="number" id="newtx-amount" inputmode="decimal" step="0.01" placeholder="0,00" required>
          </div>
          <!-- Category (hidden for transfers) -->
          <div class="newtx-field" id="newtx-category-field">
            <label for="newtx-category-input">Categoría</label>
            <div class="newtx-filterable" id="newtx-category-wrapper">
              <input type="text" id="newtx-category-input" placeholder="Buscar categoría…" autocomplete="off" required>
              <input type="hidden" id="newtx-category-value">
              <div class="newtx-dropdown" id="newtx-category-dropdown"></div>
            </div>
          </div>
          <!-- Transfer destination (shown only for transfers) -->
          <div class="newtx-field" id="newtx-dest-field" style="display:none">
            <label for="newtx-dest-input">Cuenta destino</label>
            <div class="newtx-filterable" id="newtx-dest-wrapper">
              <input type="text" id="newtx-dest-input" placeholder="Buscar cuenta destino…" autocomplete="off">
              <input type="hidden" id="newtx-dest-value">
              <div class="newtx-dropdown" id="newtx-dest-dropdown"></div>
            </div>
          </div>
          <!-- Payee / Description -->
          <div class="newtx-field">
            <label for="newtx-payee-input">Descripción</label>
            <div class="newtx-filterable" id="newtx-payee-wrapper">
              <input type="text" id="newtx-payee-input" placeholder="Buscar o escribir descripción…" autocomplete="off"
                required>
              <div class="newtx-dropdown" id="newtx-payee-dropdown"></div>
            </div>
          </div>
          <!-- Submit -->
          <button type="submit" class="newtx-submit" id="newtx-submit">Guardar transacción</button>
          <!-- Delete (only in edit mode) -->
          <button type="button" class="newtx-delete" id="newtx-delete" style="display:none">Eliminar
            transacción</button>
        </form>
      </div>
    </div>
  </main>

  <script src="index.js"></script>
</body>

</html>
